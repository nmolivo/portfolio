name: Sync Resume from Google Docs

on:
  repository_dispatch:
    types: [resume-updated] # Triggered by Google Apps Script
  workflow_dispatch: # Manual trigger for testing

jobs:
  sync-resume:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Run resume fetch script
        env:
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python main.py

      - name: Create and push branch
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b resume-update
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Update resume from Google Docs"
            git push origin resume-update --force
          else
            echo "No changes to commit"
            exit 0
          fi

      - name: Create Pull Request
        run: |
          curl -X POST \
          -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/pulls \
          -d '{
              "title": "Resume Update",
              "body": "Automated sync from Google Docs",
              "head": "resume-update",
              "base": "main"
          }'
